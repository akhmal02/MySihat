<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .leaflet-container {
            background: #e2e8f0 !important;
        }
        .pin-clinic {
            background: #0284c7;
            border: 2.5px solid #ffffff;
            border-radius: 50%;
            color: #ffffff;
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.45);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .pin-clinic:active {
            transform: scale(1.2);
        }
        .pin-hospital {
            background: #dc2626;
            border: 2.5px solid #ffffff;
            border-radius: 50%;
            color: #ffffff;
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.45);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .pin-hospital:active {
            transform: scale(1.2);
        }
        .pin-user {
            background: #059669;
            border: 3px solid #ffffff;
            border-radius: 50%;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.5);
        }
        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            padding: 4px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25);
        }
        .popup-box {
            padding: 8px 6px;
            min-width: 180px;
        }
        .popup-title {
            font-size: 13px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 2px;
            line-height: 1.25;
        }
        .popup-type {
            font-size: 11px;
            font-weight: 700;
            color: #0284c7;
            margin-bottom: 4px;
        }
        .popup-queue {
            font-size: 11px;
            color: #475569;
        }
        .popup-queue b {
            color: #0369a1;
        }
        .popup-hint {
            margin-top: 6px;
            font-size: 10px;
            color: #059669;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Smooth responsive map with default center in Perak
        var map = L.map('map', {
            zoomControl: true,
            attributionControl: false,
            fadeAnimation: true,
            zoomAnimation: true,
            preferCanvas: true
        }).setView([4.1757, 101.2164], 12);

        // Primary: OpenStreetMap tile server
        var primaryTileUrl = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
        var fallbackTileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}';

        var tileLayer = L.tileLayer(primaryTileUrl, {
            maxZoom: 19,
            keepBuffer: 6,
            updateWhenIdle: false,
            updateWhenZooming: true,
            attribution: ''
        }).addTo(map);

        tileLayer.on('tileerror', function(error, tile) {
            if (error && error.tile && !error.tile._fallbackApplied) {
                error.tile._fallbackApplied = true;
                var z = error.coords.z;
                var y = error.coords.y;
                var x = error.coords.x;
                error.tile.src = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/' + z + '/' + y + '/' + x;
            }
        });

        // User GPS Location Pin
        var userIcon = L.divIcon({
            className: 'pin-user',
            html: '📍',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });
        var userMarker = L.marker([4.1757, 101.2164], { icon: userIcon }).addTo(map);
        userMarker.bindPopup("<div class='popup-box'><div class='popup-title'>Lokasi GPS Anda</div><div class='popup-type'>Perak, Malaysia</div></div>");

        var facilityMarkers = {};

        function addFacilityMarker(f) {
            var iconHtml = f.isHosp ? 'H' : '+';
            var iconClass = f.isHosp ? 'pin-hospital' : 'pin-clinic';
            var icon = L.divIcon({
                className: iconClass,
                html: iconHtml,
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
            var m = L.marker([f.lat, f.lng], { icon: icon }).addTo(map);
            
            var statusBadge = f.isOpen 
                ? "<span style='color:#10b981;font-weight:bold;'>● Buka Sekarang</span>" 
                : "<span style='color:#ef4444;font-weight:bold;'>○ Tutup Sekarang (Dibuka 8:00 AM)</span>";
            var html = "<div class='popup-box'>" +
                "<div class='popup-title'>" + f.name + "</div>" +
                "<div class='popup-type'>" + f.type + " &bull; " + statusBadge + "</div>" +
                "<div class='popup-hint'>✓ Sentuh untuk butiran perkhidmatan & arah jalan</div>" +
                "</div>";
            m.bindPopup(html);

            m.on('click', function() {
                if (window.AndroidBridge && window.AndroidBridge.selectFacility) {
                    window.AndroidBridge.selectFacility(f.id);
                }
            });

            facilityMarkers[f.id] = m;
        }

        window.renderFacilities = function(facilitiesJson) {
            try {
                // Clear existing markers
                for (var id in facilityMarkers) {
                    if (facilityMarkers[id]) {
                        map.removeLayer(facilityMarkers[id]);
                    }
                }
                facilityMarkers = {};

                var list = JSON.parse(facilitiesJson);
                list.forEach(function(f) {
                    addFacilityMarker(f);
                });
            } catch (e) {
                console.error(e);
            }
        };

        window.focusFacility = function(lat, lng, id) {
            if (!map) return;
            try {
                map.flyTo([lat, lng], 15, { duration: 0.6 });
                setTimeout(function() {
                    if (facilityMarkers[id]) {
                        facilityMarkers[id].openPopup();
                    }
                }, 650);
            } catch (e) {
                console.error(e);
            }
        };

        var stateCoordinates = {
            "Semua": [4.2105, 101.9758, 7],
            "All": [4.2105, 101.9758, 7],
            "Perak": [4.1757, 101.2164, 11],
            "Putrajaya": [2.9372, 101.6784, 13],
            "Kuala Lumpur": [3.1390, 101.6869, 13],
            "Selangor": [3.0738, 101.5183, 11],
            "Johor": [1.4927, 103.7414, 11],
            "Pulau Pinang": [5.4164, 100.3327, 12],
            "Penang": [5.4164, 100.3327, 12],
            "Kedah": [6.1184, 100.3685, 11],
            "Melaka": [2.2174, 102.2612, 12],
            "Malacca": [2.2174, 102.2612, 12],
            "Negeri Sembilan": [2.7092, 101.9427, 11],
            "Pahang": [3.8055, 103.3242, 11],
            "Terengganu": [5.3282, 103.1492, 11],
            "Kelantan": [6.1265, 102.2472, 11],
            "Perlis": [6.4414, 100.1912, 12],
            "Sabah": [5.9525, 116.0712, 11],
            "Sarawak": [1.5435, 110.3421, 11],
            "Labuan": [5.2831, 115.2308, 12]
        };

        window.flyToState = function(state) {
            if (!map) return;
            try {
                if (stateCoordinates[state]) {
                    var coord = stateCoordinates[state];
                    map.flyTo([coord[0], coord[1]], coord[2], { duration: 0.8 });
                }
            } catch (e) {
                console.error(e);
            }
        };

        window.setUserLocation = function(lat, lng, label) {
            if (!map) return;
            try {
                if (!userMarker) {
                    userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
                } else {
                    userMarker.setLatLng([lat, lng]);
                }
                userMarker.bindPopup("<div class='popup-box'><div class='popup-title'>Lokasi GPS Anda</div><div class='popup-type'>" + label + "</div></div>");
                map.flyTo([lat, lng], 14, { duration: 0.8 });
                setTimeout(function() {
                    userMarker.openPopup();
                }, 850);
            } catch (e) {
                console.error(e);
            }
        };

        window.recenterUser = function() {
            if (!map || !userMarker) return;
            try {
                var pos = userMarker.getLatLng();
                map.flyTo(pos, 14, { duration: 0.7 });
                setTimeout(function() {
                    userMarker.openPopup();
                }, 750);
            } catch (e) {
                console.error(e);
            }
        };

        // Window resize handler
        window.addEventListener('resize', function() {
            if (map) {
                map.invalidateSize(false);
            }
        });
    </script>
</body>
</html>
